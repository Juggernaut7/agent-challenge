name: Docker Build and Push

on:
  push:
    branches: [ "elizaforge" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # Force a clean sharp build for the Linux environment
          pnpm add sharp

      - name: Build Next.js app
        shell: bash
        run: |
          set -o pipefail
          # Create .env.local dynamically to guarantee worker process inheritance
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Ym9ndXMtY2xlcmstNzIuY2xlcmsuYWNjb3VudHMuZGV2JA' }}" > .env.local
          echo "NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dummy.convex.cloud' }}" >> .env.local
          echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY || 'sk_test_bogus' }}" >> .env.local
          
          export NEXT_TELEMETRY_DISABLED=1
          export NODE_OPTIONS="--max-old-space-size=6144"
          
          pnpm run build 2>&1 | tee build.log
          
          echo "Listing .next directory structure:"
          ls -la .next || echo ".next directory not found"

      - name: Log build error on failure
        if: failure()
        run: cat build.log

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/elizaforge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
